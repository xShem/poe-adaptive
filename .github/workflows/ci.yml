name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, run checks and package with the shared pipeline
        shell: pwsh
        run: ./Build.ps1 -Output "$PWD/artifacts/Первичная сборка"
      - name: Check synthetic diagnostic ZIP from the console runner
        shell: pwsh
        run: |
          $result = Get-ChildItem 'artifacts/Первичная сборка' -Directory | Select-Object -First 1
          $sample = Join-Path $result.FullName 'diagnostic-synthetic.zip'
          if (-not (Test-Path $sample)) { throw 'Diagnostic sample missing' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($sample)
          try {
            if ($zip.Entries.FullName -notcontains 'manifest.json' -or $zip.Entries.FullName -notcontains 'README-FOR-AI.md') { throw 'Diagnostic metadata missing' }
            if ($zip.Entries.FullName -match '\.(ggpk|exe|dll)$|\.bundle\.bin$|\.index\.bin$') { throw 'Prohibited content' }
          } finally { $zip.Dispose() }
      - name: Check both Windows main windows
        shell: pwsh
        run: |
          $result = Get-ChildItem 'artifacts/Первичная сборка' -Directory | Select-Object -First 1
          foreach ($item in @(@('app/PoeAdaptive.exe', 'PoE Adaptive*'), @('builder/PoeAdaptive.Builder.exe', 'PoeAdaptive Builder*'))) {
            $process = Start-Process -FilePath (Join-Path $result.FullName $item[0]) -PassThru
            try {
              if (-not $process.WaitForInputIdle(20000)) { throw 'Window did not initialize' }
              Start-Sleep -Seconds 3
              $process.Refresh()
              if ($process.HasExited -or $process.MainWindowHandle -eq 0 -or $process.MainWindowTitle -notlike $item[1]) { throw "Expected window missing: $($item[0])" }
              Write-Host "Opened: $($process.MainWindowTitle)"
            } finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }
          }
      - name: Bootstrap official pinned SDK in an empty user cache
        shell: pwsh
        run: |
          dotnet run --project PoeAdaptive.BuildHost -c Release --no-build -- --bootstrap-sdk --sdk-cache "$PWD/artifacts/SDK cache"
          if ($LASTEXITCODE -ne 0) { throw 'SDK bootstrap failed' }
      - name: Self-contained Builder builds again from cached dependencies, with Cyrillic paths
        shell: pwsh
        run: |
          $result = Get-ChildItem 'artifacts/Первичная сборка' -Directory | Select-Object -First 1
          $start = [System.Diagnostics.ProcessStartInfo]::new((Join-Path $result.FullName 'builder/PoeAdaptive.Builder.exe'))
          $start.UseShellExecute = $false
          foreach ($argument in @('--build', '--source', "$PWD", '--output', "$PWD/artifacts/Сборка без сети", '--offline', '--dotnet', "$PWD/artifacts/SDK cache/10.0.403/dotnet.exe")) { $start.ArgumentList.Add($argument) }
          $process = [System.Diagnostics.Process]::Start($start)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Builder failed: $($process.ExitCode)" }
          $built = Get-ChildItem 'artifacts/Сборка без сети' -Directory | Select-Object -First 1
          if (-not (Test-Path (Join-Path $built.FullName 'app/PoeAdaptive.exe'))) { throw 'Builder did not create app' }
      - name: Verify source script supports cached offline rebuild
        shell: pwsh
        run: ./Build.ps1 -Output "$PWD/artifacts/Скрипт без сети" -Offline -SdkCache "$PWD/artifacts/SDK cache"
      - name: Stage release packages from the tested commit
        shell: pwsh
        run: |
          $result = Get-ChildItem 'artifacts/Первичная сборка' -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item "$($result.FullName)/*.zip" release/
          Copy-Item "$($result.FullName)/SHA256SUMS.txt" release/
          Copy-Item "$($result.FullName)/build-info.json" release/
          $info = Get-Content release/build-info.json -Raw | ConvertFrom-Json
          if ($info.sourceCommit -ne (git rev-parse HEAD) -or $info.localChanges) { throw 'Source provenance mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: PoeAdaptive-win-x64
          path: release/
