name: Publish tested Windows release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and test run ID
        required: true
        type: string
      tag:
        description: Version tag matching the application version
        required: true
        default: v0.3.0
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate source build
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GH_REPO']
          run_id = os.environ['SOURCE_RUN_ID']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('Invalid run ID')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_TAG']):
              raise SystemExit('Invalid version tag')
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}'], text=True))
          if (run['conclusion'] != 'success' or run['status'] != 'completed'
              or run['path'] != '.github/workflows/ci.yml'
              or run['head_repository']['full_name'] != repo):
              raise SystemExit('A successful build from this repository is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          print('Packaging tested commit', run['head_sha'])
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: PoeAdaptive-win-x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: staged
      - name: Verify tested packages and matching source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, shutil, zipfile
          import xml.etree.ElementTree as ET
          version = os.environ['RELEASE_TAG'][1:]
          if ET.parse('PoeRedux/PoeRedux.csproj').findtext('.//Version') != version:
              raise SystemExit('Tag does not match application version')
          staged = pathlib.Path('staged')
          info = json.loads((staged / 'build-info.json').read_text())
          if info['version'] != version or info['sourceCommit'] != os.environ['SOURCE_SHA'] or info['localChanges']:
              raise SystemExit('Binary/source provenance mismatch')
          expected = {f'PoeAdaptive-{version}-win-x64.zip': 'PoeAdaptive.exe',
                      f'PoeAdaptive-Builder-{version}-win-x64.zip': 'PoeAdaptive.Builder.exe',
                      f'PoeAdaptive-{version}-source.zip': 'PoeAdaptive/PoeRedux.slnx'}
          sums = dict(line.split('  ', 1)[::-1] for line in (staged / 'SHA256SUMS.txt').read_text().splitlines())
          for name, entry in expected.items():
              file = staged / name
              if hashlib.sha256(file.read_bytes()).hexdigest() != sums[name]:
                  raise SystemExit('Checksum mismatch: ' + name)
              with zipfile.ZipFile(file) as z:
                  if z.testzip() or entry not in z.namelist(): raise SystemExit('Invalid archive: ' + name)
                  if any(path.lower().endswith('.dll') and 'oo2core' in path.lower() for path in z.namelist()): raise SystemExit('Oodle redistribution prohibited')
          shutil.copytree(staged, 'release')
          pathlib.Path('release/notes.md').write_text(
              f'PoE Adaptive {version}: ограниченные диагностические ZIP, адаптеры Steam/GGG/Epic и Builder для Windows 11 x64.\n\n'
              '.NET Runtime включён в оба приложения. Oodle DLL требуется отдельно из локальной установки. '
              'Исходники, документация и SHA-256 приложены. Матрица различает синтетические проверки и проверку настоящих клиентов; '
              'совместимость правил с текущими играми ещё не подтверждена.\n\n'
              f"Коммит `{info['sourceCommit']}`; Windows CI https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['SOURCE_RUN_ID']}\n", encoding='utf-8')
          PYCODE
      - name: Upload and publish prerelease
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          sha = os.environ['SOURCE_SHA']
          releases = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases?per_page=100'], text=True))
          existing = next((r for r in releases if r['tag_name'] == tag), None)
          if existing:
              if not existing['draft']:
                  raise SystemExit('This version is already published; choose a new version')
              target = existing['target_commitish']
              commit = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/commits/{target}'], text=True))
              if commit['sha'] != sha:
                  raise SystemExit('Draft release targets a different commit')
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--draft', '--prerelease',
                  '--target', sha, '--title', f'PoE Adaptive {tag} — тестовая версия',
                  '--notes-file', 'release/notes.md'], check=True)
          files = [str(p) for p in sorted(Path('release').iterdir()) if p.suffix in ('.zip', '.txt', '.json')]
          subprocess.run(['gh', 'release', 'upload', tag, *files, '--clobber'], check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--prerelease',
              '--title', f'PoE Adaptive {tag} — тестовая версия', '--notes-file', 'release/notes.md'], check=True)
          PY
