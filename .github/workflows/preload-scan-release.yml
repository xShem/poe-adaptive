name: Test and publish standalone GGPK preload scanner
on:
  push:
    branches: [feature/preload-ggpk-function-scanner]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore and run synthetic regression runner
        shell: pwsh
        run: |
          dotnet restore PoeRedux.slnx
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet run --project PoeAdaptive.Tests -c Release --no-restore -- --diagnostic-sample "$PWD/synthetic.zip"
          if ($LASTEXITCODE -ne 0) { throw "Regression checks failed" }
      - name: Publish standalone scanner with bundled .NET runtime
        shell: pwsh
        run: |
          dotnet publish PoeAdaptive.PreloadScan/PoeAdaptive.PreloadScan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o "$PWD/scanner"
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (-not (Test-Path scanner/PoeAdaptive.PreloadScan.exe)) { throw "No scanner executable" }
          Copy-Item docs/PRELOAD-SCAN-RU.md scanner/README-RU.md
          New-Item -ItemType Directory -Path package | Out-Null
          Compress-Archive -Path scanner/* -DestinationPath package/PoeAdaptive-PreloadScan-0.1.1-win-x64.zip
          $sha = (Get-FileHash package/PoeAdaptive-PreloadScan-0.1.1-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content package/SHA256SUMS.txt "$sha  PoeAdaptive-PreloadScan-0.1.1-win-x64.zip"
          [ordered]@{ schemaVersion = 1; version = "0.1.1"; sourceCommit = "$env:GITHUB_SHA"; syntheticTestsPassed = $true; realClientTested = $false; decodesOodleBundles = $false } |
            ConvertTo-Json | Set-Content package/build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: PoeAdaptive-PreloadScan-windows-x64
          path: package/
          if-no-files-found: error
  github-release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PoeAdaptive-PreloadScan-windows-x64
          path: package
      - name: Verify and publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          root = Path("package")
          name = "PoeAdaptive-PreloadScan-0.1.1-win-x64.zip"
          sha = hashlib.sha256((root/name).read_bytes()).hexdigest()
          assert (root/"SHA256SUMS.txt").read_text().strip() == sha + "  " + name
          info = json.loads((root/"build-info.json").read_text(encoding="utf-8-sig"))
          assert info["sourceCommit"] == os.environ["GITHUB_SHA"] and info["syntheticTestsPassed"]
          with zipfile.ZipFile(root/name) as archive:
              assert archive.testzip() is None
              assert {"PoeAdaptive.PreloadScan.exe", "README-RU.md"}.issubset(archive.namelist())
          PY
          tag="preloadscan-v0.1.1"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; will not overwrite"
            exit 1
          fi
          gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA"             --title "PoE Adaptive PreloadScan 0.1.1 - GGPK preload diagnostic" --prerelease             --notes "Standalone Windows x64 tool: drag Content.ggpk onto PoeAdaptive.PreloadScan.exe. Reports file/text clues without modifying GGPK. Does not decompress Oodle bundles. Synthetic tests only, current league compatibility not established."             package/PoeAdaptive-PreloadScan-0.1.1-win-x64.zip package/SHA256SUMS.txt package/build-info.json
